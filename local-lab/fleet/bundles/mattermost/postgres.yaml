apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mattermost-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.9
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: local-path
    size: 4Gi
  bootstrap:
    initdb:
      database: mattermost
      owner: mattermost
      secret:
        name: mattermost-db-app
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
