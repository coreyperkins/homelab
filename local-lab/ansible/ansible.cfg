[defaults]
inventory = %(here)s/inventory/hosts.yml
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
private_key_file = %(here)s/../../.secrets/rke2-lab-ed25519

[ssh_connection]
ssh_args = -o UserKnownHostsFile=%(here)s/../../.secrets/known_hosts -o IdentitiesOnly=yes
