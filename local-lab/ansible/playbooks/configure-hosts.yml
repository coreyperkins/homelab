---
- name: Configure RHEL prerequisites for RKE2
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Require the selected RHEL major version
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
          - ansible_distribution_major_version == rhel_major_version
        fail_msg: >-
          This playbook expects RHEL {{ rhel_major_version }}. Review the DVD
          repositories and kernel prerequisites before using another release.

    - name: Check SELinux mode
      ansible.builtin.command: getenforce
      register: rhel_selinux_mode
      changed_when: false

    - name: Require SELinux enforcing mode
      ansible.builtin.assert:
        that:
          - rhel_selinux_mode.stdout == "Enforcing"
        fail_msg: SELinux must be enabled in enforcing mode before RKE2 setup.

    - name: Create the RHEL DVD mount point
      ansible.builtin.file:
        path: "{{ rhel_dvd_mount }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Mount the attached RHEL DVD and persist the mount
      ansible.builtin.mount:
        path: "{{ rhel_dvd_mount }}"
        src: "LABEL={{ rhel_dvd_volume_label }}"
        fstype: iso9660
        opts: ro,nofail,x-systemd.device-timeout=3s
        dump: "0"
        passno: "0"
        state: mounted

    - name: Configure local RHEL DVD repositories
      ansible.builtin.yum_repository:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        file: rhel-dvd
        baseurl: "file://{{ rhel_dvd_mount }}/{{ item.path }}"
        enabled: true
        gpgcheck: true
        gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
      loop:
        - name: rhel-dvd-baseos
          description: RHEL DVD BaseOS
          path: BaseOS
        - name: rhel-dvd-appstream
          description: RHEL DVD AppStream
          path: AppStream

    - name: Install RHEL 10 RKE2 kernel modules
      ansible.builtin.dnf:
        name: kernel-modules-extra
        state: present

    - name: Exclude Canal interfaces from NetworkManager management
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/rke2-canal.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [keyfile]
          unmanaged-devices=interface-name:flannel*;interface-name:cali*;interface-name:tunl*;interface-name:vxlan.calico;interface-name:vxlan-v6.calico;interface-name:wireguard.cali;interface-name:wg-v6.cali
      notify: Reload NetworkManager

    - name: Stop firewalld for this isolated Canal practice cluster
      ansible.builtin.service:
        name: firewalld
        state: stopped
        enabled: false
      when: rke2_disable_firewalld | bool

  handlers:
    - name: Reload NetworkManager
      ansible.builtin.command: nmcli general reload
      changed_when: false
